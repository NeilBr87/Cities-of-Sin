# Local Supabase stack. `npx supabase start` needs Docker Desktop running.
# `project_id` is only a label for the local containers; `supabase link` sets
# the real project reference in supabase/.temp, which is gitignored.

project_id = "citiesofsin"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Catches outbound mail locally so signup confirmation links are readable
# at http://localhost:54324 instead of being sent for real.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off locally so playtesting does not need a mail round-trip. Keep it ON in the
# hosted project — it is the cheapest anti-alt measure available.
enable_confirmations = false
